<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVault | Secure Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="session-manager.js"></script>
    <script src="crypto-service.js"></script>
    <script src="api.js"></script>
    <script src="auth-service.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .nebula-grad {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #c026d3 100%);
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .note-card:hover {
            border-color: #a855f7;
            background: rgba(30, 41, 59, 0.9);
        }
    </style>
</head>

<body class="min-h-screen pb-12">
    <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center mb-12">
        <div class="flex items-center space-x-2">
            <div class="w-10 h-10 nebula-grad rounded-xl flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                    </path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Secure Notes</h1>
        </div>
        <div class="flex items-center space-x-5 text-sm font-semibold">
            <a href="stego.html" class="text-gray-400 hover:text-white transition-colors">Stego Hub</a>
            <a href="vault.html" class="text-gray-400 hover:text-white transition-colors">Vault</a>
            <a href="audit.html" class="text-gray-400 hover:text-white transition-colors">Audit</a>
            <a href="generator.html" class="text-gray-400 hover:text-white transition-colors">Generator</a>
            <a href="notes.html" class="text-white font-bold transition-colors">Notes</a>
            <span class="text-gray-600">|</span>
            <a href="dashboard.html" class="text-gray-400 hover:text-white transition-colors">Dashboard</a>
            <button onclick="logout()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition-all">Logout</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6">
        <!-- Master Password Lock Overlay -->
        <div id="lock-overlay" class="glass rounded-3xl p-12 text-center max-w-md mx-auto my-20">
            <h2 class="text-2xl font-bold mb-2">Notes Locked</h2>
            <p class="text-gray-400 mb-8 text-sm">Enter Master Password to decrypt your private notes.</p>
            <input type="password" id="master-pwd"
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 mb-4 focus:outline-none focus:border-purple-500"
                placeholder="Master Password">
            <button onclick="unlockNotes()" class="w-full nebula-grad py-3 rounded-xl font-bold shadow-lg">Unlock
                Notes</button>
        </div>

        <!-- Notes Content -->
        <div id="notes-content" class="hidden">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xl font-bold">Your Private Notes</h3>
                <button onclick="toggleModal('add-modal', true)"
                    class="px-6 py-2 rounded-xl nebula-grad font-bold text-sm">Create Note</button>
            </div>

            <div class="space-y-4" id="notes-list">
                <!-- Notes will appear here -->
            </div>
        </div>
    </main>

    <!-- Add Note Modal -->
    <div id="add-modal"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="glass max-w-lg w-full rounded-2xl p-8">
            <h2 class="text-2xl font-bold mb-6">New Secure Note</h2>
            <form id="add-note-form" class="space-y-4">
                <input type="text" id="note-title" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-purple-500"
                    placeholder="Note Title">
                <textarea id="note-content" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 h-48 focus:outline-none focus:border-purple-500"
                    placeholder="Type your sensitive information here..."></textarea>
                <div class="flex space-x-4">
                    <button type="button" onclick="toggleModal('add-modal', false)"
                        class="flex-1 px-4 py-3 rounded-xl bg-slate-800 font-bold">Cancel</button>
                    <button type="submit" class="flex-2 px-8 py-3 rounded-xl nebula-grad font-bold shadow-lg">Save
                        Encrypted</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentMasterPassword = "";
        let currentNotes = [];

        // Auto-unlock if valid session exists
        document.addEventListener("DOMContentLoaded", async () => {
            const session = window.SessionManager.getSession();
            if (session) {
                currentMasterPassword = session.encryptionKey;
                await loadNotes();
            }
        });

        async function unlockNotes() {
            const pwd = document.getElementById('master-pwd').value;
            console.log("[NOTES] Unlock attempted");
            if (!pwd) return showToast("Password required", "error");
            
            currentMasterPassword = pwd;
            await loadNotes();
        }

        async function loadNotes() {
            try {
                console.log("[NOTES] Loading notes...");
                const res = await window.api.post('/notes/list', { master_password: currentMasterPassword });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Authentication Failed");
                }

                const notes = await res.json();
                currentNotes = notes;
                console.log("[NOTES] Decrypted notes received:", notes.length);
                renderNotes(notes);

                document.getElementById('lock-overlay').classList.add('hidden');
                document.getElementById('notes-content').classList.remove('hidden');
            } catch (err) {
                console.error("[NOTES ERROR]", err);
                showToast(err.message || "Incorrect Master Password or connection lost.", "error");
                currentMasterPassword = "";
            }
        }

        function renderNotes(notes) {
            const list = document.getElementById('notes-list');
            list.innerHTML = notes.map(n => `
                <div class="glass p-6 rounded-2xl note-card transition-all group">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="text-lg font-bold text-purple-400">${n.title}</h4>
                        <button data-note-id="${n.id}" class="delete-btn text-gray-500 hover:text-red-400 group-hover:block hidden transition-all">✕</button>
                    </div>
                    <p class="text-gray-300 whitespace-pre-wrap text-sm leading-relaxed">${n.content}</p>
                    <div class="mt-4 pt-4 border-t border-white/5 text-[10px] text-gray-500 uppercase tracking-tighter">
                        Last Updated: ${new Date(n.updated_at).toLocaleString()}
                    </div>
                </div>
            `).join('');

            // Attach event listeners
            list.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.getAttribute('data-note-id'));
                    deleteNote(id);
                });
            });
        }

        document.getElementById('add-note-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                title: document.getElementById('note-title').value,
                content: document.getElementById('note-content').value,
                master_password: currentMasterPassword
            };

            const res = await window.api.post('/notes/add', data);

            if (res.ok) {
                toggleModal('add-modal', false);
                document.getElementById('add-note-form').reset();
                loadNotes();
            } else {
                const err = await res.json();
                showToast(err.detail || "Failed to save encrypted note.", "error");
            }
        });

        async function deleteNote(id) {
            if (confirm("Delete this secret note?")) {
                await window.api.delete(`/notes/delete/${id}`);
                loadNotes();
            }
        }

        function toggleModal(id, show) {
            document.getElementById(id).classList.toggle('hidden', !show);
            document.getElementById(id).classList.toggle('flex', show);
        }

        function logout() { window.AuthService.logout(); }

        function showToast(message, type = 'success') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.style.cssText = `
                padding: 12px 20px;
                border-radius: 12px;
                color: white;
                font-family: 'Outfit', sans-serif;
                font-size: 0.875rem;
                font-weight: 600;
                backdrop-filter: blur(12px);
                background: ${type === 'success' ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)'};
                border: 1px solid ${type === 'success' ? 'rgba(16,185,129,0.4)' : 'rgba(239,68,68,0.4)'};
                box-shadow: 0 8px 32px rgba(0,0,0,0.3);
                opacity: 0;
                transform: translateY(16px);
                transition: all 0.3s ease;
                max-width: 320px;
            `;
            toast.innerText = message;
            container.appendChild(toast);
            requestAnimationFrame(() => { toast.style.opacity = '1'; toast.style.transform = 'translateY(0)'; });
            setTimeout(() => {
                toast.style.opacity = '0'; toast.style.transform = 'translateY(-12px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>

</html>
