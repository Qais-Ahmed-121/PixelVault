<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVault | Quantum Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="session-manager.js"></script>
    <script src="crypto-service.js"></script>
    <script src="api.js"></script>
    <script src="auth-service.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .nebula-grad {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #c026d3 100%);
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        input[type=range] {
            accent-color: #7c3aed;
        }
    </style>
</head>

<body class="min-h-screen">
    <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center mb-12">
        <div class="flex items-center space-x-2">
            <div class="w-10 h-10 nebula-grad rounded-xl flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4">
                    </path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Quantum Generator</h1>
        </div>
        <div class="flex items-center space-x-5 text-sm font-semibold">
            <a href="stego.html" class="text-gray-400 hover:text-white transition-colors">Stego Hub</a>
            <a href="vault.html" class="text-gray-400 hover:text-white transition-colors">Vault</a>
            <a href="audit.html" class="text-gray-400 hover:text-white transition-colors">Audit</a>
            <a href="generator.html" class="text-white font-bold transition-colors">Generator</a>
            <a href="notes.html" class="text-gray-400 hover:text-white transition-colors">Notes</a>
            <span class="text-gray-600">|</span>
            <a href="dashboard.html" class="text-gray-400 hover:text-white transition-colors">Dashboard</a>
            <button onclick="window.AuthService.logout()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition-all">Logout</button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-6">
        <div class="glass p-10 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-500/20 blur-3xl rounded-full"></div>

            <!-- Result Display -->
            <div class="bg-black/40 p-8 rounded-2xl mb-8 border border-white/5 relative group">
                <input type="text" id="pass-result" readonly
                    class="w-full bg-transparent text-center text-3xl font-mono font-bold text-indigo-400 focus:outline-none"
                    value="P@ssw0rd123!">
                <div
                    class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity bg-black/60 rounded-2xl">
                    <button onclick="copyPass()" class="px-6 py-2 rounded-xl nebula-grad font-bold">Click to
                        Copy</button>
                </div>
            </div>

            <!-- Mode Selector -->
            <div class="flex bg-slate-900/50 p-1 rounded-2xl mb-8">
                <button onclick="setMode('random')" id="btn-random"
                    class="flex-1 py-3 rounded-xl font-bold bg-indigo-600 text-white transition-all">Quantum
                    Random</button>
                <button onclick="setMode('smart')" id="btn-smart"
                    class="flex-1 py-3 rounded-xl font-bold text-gray-400 hover:text-white transition-all">Smart
                    Keyword</button>
            </div>

            <!-- Random Config -->
            <div id="random-config" class="space-y-6">
                <div>
                    <div class="flex justify-between mb-4">
                        <label class="text-sm font-bold text-gray-400 uppercase tracking-widest">Password Length</label>
                        <span id="length-val" class="text-indigo-400 font-bold">16</span>
                    </div>
                    <input type="range" id="length-slider" min="8" max="32" value="16"
                        class="w-full h-2 rounded-lg cursor-pointer"
                        oninput="document.getElementById('length-val').innerText = this.value; generateRandom()">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <label
                        class="glass p-4 rounded-xl flex items-center justify-between cursor-pointer border border-transparent hover:border-purple-500/30">
                        <span class="text-sm">Uppercase</span>
                        <input type="checkbox" id="chk-upper" checked onchange="generateRandom()">
                    </label>
                    <label
                        class="glass p-4 rounded-xl flex items-center justify-between cursor-pointer border border-transparent hover:border-purple-500/30">
                        <span class="text-sm">Numbers</span>
                        <input type="checkbox" id="chk-nums" checked onchange="generateRandom()">
                    </label>
                    <label
                        class="glass p-4 rounded-xl flex items-center justify-between cursor-pointer border border-transparent hover:border-purple-500/30">
                        <span class="text-sm">Symbols</span>
                        <input type="checkbox" id="chk-syms" checked onchange="generateRandom()">
                    </label>
                </div>
            </div>

            <!-- Smart Config -->
            <div id="smart-config" class="hidden animate-in slide-in-from-right-10 duration-300">
                <label class="text-sm font-bold text-gray-400 uppercase tracking-widest block mb-4">Base Keyword</label>
                <input type="text" id="keyword-input"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-4 focus:outline-none focus:border-purple-500 mb-6"
                    placeholder="e.g. Nebula" oninput="generateSmart()">
                <p class="text-xs text-gray-500 italic">We use leet-speak substitutions and random padding to make your
                    keyword secure.</p>
            </div>

            <button onclick="mainGenerate()"
                class="w-full nebula-grad py-5 rounded-2xl font-bold shadow-xl shadow-purple-500/20 mt-10 transition-transform hover:scale-[1.01] active:scale-[0.99]">
                Generate New Key
            </button>
        </div>
    </main>

    <script>
        let currentMode = 'random';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('random-config').classList.toggle('hidden', mode !== 'random');
            document.getElementById('smart-config').classList.toggle('hidden', mode !== 'smart');

            const btnR = document.getElementById('btn-random');
            const btnS = document.getElementById('btn-smart');

            if (mode === 'random') {
                btnR.classList.add('bg-indigo-600', 'text-white');
                btnR.classList.remove('text-gray-400');
                btnS.classList.remove('bg-indigo-600', 'text-white');
                btnS.classList.add('text-gray-400');
            } else {
                btnS.classList.add('bg-indigo-600', 'text-white');
                btnS.classList.remove('text-gray-400');
                btnR.classList.remove('bg-indigo-600', 'text-white');
                btnR.classList.add('text-gray-400');
            }
            mainGenerate();
        }

        function mainGenerate() {
            if (currentMode === 'random') generateRandom();
            else generateSmart();
        }

        function generateRandom() {
            const length = document.getElementById('length-slider').value;
            const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const lower = "abcdefghijklmnopqrstuvwxyz";
            const nums = "0123456789";
            const syms = "!@#$%^&*()_+";

            let charset = lower;
            if (document.getElementById('chk-upper').checked) charset += upper;
            if (document.getElementById('chk-nums').checked) charset += nums;
            if (document.getElementById('chk-syms').checked) charset += syms;

            let ret = "";
            for (let i = 0; i < length; i++) {
                ret += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            document.getElementById('pass-result').value = ret;
        }

        function generateSmart() {
            const kw = document.getElementById('keyword-input').value || "Vault";
            const subs = { 'a': '@', 'e': '3', 'i': '1', 'o': '0', 's': '$', 't': '7' };
            let base = kw.split('').map(c => subs[c.toLowerCase()] || c).join('');
            base = base.charAt(0).toUpperCase() + base.slice(1);

            const charset = "abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
            while (base.length < 16) {
                base += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            document.getElementById('pass-result').value = base;
        }

        function copyPass() {
            const val = document.getElementById('pass-result').value;
            navigator.clipboard.writeText(val).then(() => {
                showToast("Password copied!", "success");
            });
        }

        // Initial
        mainGenerate();

        function showToast(message, type = 'success') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.style.cssText = `
                padding: 12px 20px;
                border-radius: 12px;
                color: white;
                font-family: 'Outfit', sans-serif;
                font-size: 0.875rem;
                font-weight: 600;
                backdrop-filter: blur(12px);
                background: ${type === 'success' ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)'};
                border: 1px solid ${type === 'success' ? 'rgba(16,185,129,0.4)' : 'rgba(239,68,68,0.4)'};
                box-shadow: 0 8px 32px rgba(0,0,0,0.3);
                opacity: 0;
                transform: translateY(16px);
                transition: all 0.3s ease;
                max-width: 320px;
            `;
            toast.innerText = message;
            container.appendChild(toast);
            requestAnimationFrame(() => { toast.style.opacity = '1'; toast.style.transform = 'translateY(0)'; });
            setTimeout(() => {
                toast.style.opacity = '0'; toast.style.transform = 'translateY(-12px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>

</html>
