<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StegaVault | Secure Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .nebula-grad {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #c026d3 100%);
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nebula-shadow {
            box-shadow: 0 0 50px -10px rgba(124, 58, 237, 0.3);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 bg-slate-950 relative overflow-y-auto">
    <!-- Animated Background Blobs -->
    <div class="absolute -top-20 -left-20 w-80 h-80 bg-indigo-600/20 blur-[100px] rounded-full"></div>
    <div class="absolute -bottom-20 -right-20 w-80 h-80 bg-purple-600/20 blur-[100px] rounded-full"></div>

    <div
        class="glass w-full max-w-md p-8 sm:p-10 rounded-[2.5rem] nebula-shadow relative z-10 border border-white/5 my-8">
        <div class="text-center mb-10">
            <div
                class="w-16 h-16 nebula-grad rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-indigo-500/20">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                    </path>
                </svg>
            </div>
            <h1
                class="text-3xl font-extrabold bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent mb-1">
                StegaVault</h1>
            <p id="mode-text" class="text-gray-400 text-xs">Unlock your secure multi-media vault.</p>
        </div>

        <form id="auth-form" class="space-y-5">
            <div>
                <label
                    class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 pl-1">Username</label>
                <input type="text" id="username" required
                    class="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-2xl px-5 py-3 outline-none transition-all text-sm"
                    placeholder="CyberAgent_007">
            </div>

            <div id="email-field" class="hidden">
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 pl-1">Email
                    Address</label>
                <input type="email" id="email"
                    class="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-2xl px-5 py-3 outline-none transition-all text-sm"
                    placeholder="vault@secure.com">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 pl-1">Master
                    Password</label>
                <input type="password" id="password" required
                    class="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-2xl px-5 py-3 outline-none transition-all text-sm"
                    placeholder="••••••••">
            </div>

            <div id="message" class="hidden p-4 rounded-2xl text-xs font-bold border animate-pulse"></div>

            <button type="submit" id="submit-btn"
                class="w-full nebula-grad text-white font-bold py-4 rounded-2xl hover:scale-[1.02] active:scale-[0.98] transition-all shadow-xl shadow-indigo-500/20 mt-4 mb-2">
                Authorize Access
            </button>
        </form>

        <div class="mt-8 text-center text-sm">
            <span id="toggle-text" class="text-gray-500">New around here?</span>
            <button id="toggle-btn"
                class="text-indigo-400 font-bold hover:text-indigo-300 ml-1 transition-colors">Initialize
                Account</button>
        </div>

    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        let isLogin = true;

        const authForm = document.getElementById('auth-form');
        const toggleBtn = document.getElementById('toggle-btn');
        const modeText = document.getElementById('mode-text');
        const submitBtn = document.getElementById('submit-btn');
        const toggleText = document.getElementById('toggle-text');
        const emailField = document.getElementById('email-field');
        const messageDiv = document.getElementById('message');

        if (localStorage.getItem('token')) window.location.href = 'dashboard.html';

        toggleBtn.addEventListener('click', () => {
            isLogin = !isLogin;
            modeText.innerText = isLogin ? "Unlock your secure multi-media vault." : "Secure your keys and digital assets.";
            submitBtn.innerText = isLogin ? "Authorize Access" : "Initialize Identity";
            toggleText.innerText = isLogin ? "New around here?" : "Already indexed?";
            toggleBtn.innerText = isLogin ? "Initialize Account" : "Return to Login";
            emailField.classList.toggle('hidden');
            document.getElementById('email').required = !isLogin;
            messageDiv.classList.add('hidden');
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!isLogin) {
                if (password.length < 8) return showMessage("Master Password must be 8+ chars", "red");
                if (password.toLowerCase() === username.toLowerCase()) return showMessage("Password cannot be your username", "red");
            }

            console.log(`[AUTH] Attempting ${isLogin ? 'Login' : 'Register'} for ${username}`);
            showMessage('Syncing with StegaVault...', 'indigo');

            try {
                if (isLogin) {
                    const formData = new FormData();
                    formData.append('username', username);
                    formData.append('password', password);

                    const res = await fetch(`${API_URL}/login`, { method: 'POST', body: formData });
                    if (!res.ok) throw await res.json();

                    const data = await res.json();
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('username', username);
                    window.location.href = 'dashboard.html';
                } else {
                    const email = document.getElementById('email').value;
                    const res = await fetch(`${API_URL}/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password })
                    });
                    if (!res.ok) throw await res.json();
                    showMessage('Identity Initialized! Moving to Login...', 'green');
                    setTimeout(() => toggleBtn.click(), 1500);
                }
            } catch (err) {
                console.error("[AUTH ERROR]", err);
                if (err instanceof TypeError) {
                    showMessage('Server unreachable. Is the backend running?', 'red');
                } else {
                    showMessage(err.detail || 'Access Denied', 'red');
                }
            }
        });

        function showMessage(msg, color) {
            messageDiv.innerText = msg;
            messageDiv.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/20', 'bg-green-500/10', 'text-green-400', 'border-green-500/20', 'bg-indigo-500/10', 'text-indigo-400', 'border-indigo-500/20');
            messageDiv.classList.add(`bg-${color}-500/10`, `text-${color}-400`, `border-${color}-500/20`, 'hidden');
            messageDiv.classList.remove('hidden');
        }
    </script>
</body>

</html>
